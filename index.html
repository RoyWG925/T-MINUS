<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>T-MINUS — 與全世界一起倒數</title>
  <meta name="description" content="與全世界一起倒數每個重要時刻。即時追蹤你期待的每一天。">
  <meta property="og:title" content="T-MINUS — 與全世界一起倒數">
  <meta property="og:description" content="距離下一個大事件還有多久？與全球用戶一起倒數每個值得期待的瞬間。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://roywg925.github.io/deadline-planet/">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="T-MINUS — 與全世界一起倒數">
  <meta name="twitter:description" content="距離下一個大事件還有多久？與全球用戶一起倒數每個值得期待的瞬間。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=Orbitron:wght@400;500;700;900&family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <style>
    /* ========== RESET & VARIABLES ========== */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg-void: #030308;
      --bg-deep: #07071a;
      --bg-card: rgba(12, 13, 35, 0.65);
      --glass-border: rgba(255, 255, 255, 0.07);
      --glass-border-hover: rgba(255, 255, 255, 0.14);
      --text-primary: #eeeef4;
      --text-secondary: rgba(255, 255, 255, 0.5);
      --text-muted: rgba(255, 255, 255, 0.28);
      --nav-h: 70px;
      --sports: #00FF87;
      --tech: #0099FF;
      --entertainment: #FF3366;
      --holiday: #B07CFF;
      --font-display: 'Unbounded', sans-serif;
      --font-mono: 'Orbitron', monospace;
      --font-body: 'Noto Sans TC', sans-serif;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font-body);
      background: var(--bg-void);
      color: var(--text-primary);
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* ========== GRAIN OVERLAY ========== */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 9999;
      pointer-events: none;
      opacity: 0.028;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 256px 256px;
    }

    /* ========== STAR CANVAS ========== */
    #starfield {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* ========== NEBULA ATMOSPHERE ========== */
    .nebula {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 80% 60% at 15% 20%, rgba(80, 0, 200, 0.09) 0%, transparent 70%),
        radial-gradient(ellipse 60% 80% at 85% 70%, rgba(0, 80, 220, 0.07) 0%, transparent 70%),
        radial-gradient(ellipse 50% 50% at 50% 90%, rgba(200, 0, 80, 0.05) 0%, transparent 60%);
      animation: nebula-drift 40s ease-in-out infinite alternate;
    }

    @keyframes nebula-drift {
      0% { transform: scale(1) translate(0, 0); }
      50% { transform: scale(1.05) translate(-2%, 1%); }
      100% { transform: scale(1) translate(1%, -1%); }
    }

    /* ========== NAVIGATION ========== */
    .nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--nav-h);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 clamp(20px, 4vw, 48px);
      background: rgba(3, 3, 8, 0.7);
      backdrop-filter: blur(24px);
      border-bottom: 1px solid var(--glass-border);
    }

    .nav-brand {
      font-family: var(--font-display);
      font-weight: 900;
      font-size: clamp(0.85rem, 2vw, 1.1rem);
      letter-spacing: 0.15em;
      background: linear-gradient(135deg, #fff 40%, rgba(176, 124, 255, 0.8));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .nav-brand span {
      -webkit-text-fill-color: rgba(176, 124, 255, 0.9);
      font-weight: 400;
      font-size: 0.65em;
      letter-spacing: 0.3em;
      display: block;
      margin-top: -2px;
    }

    .btn-create {
      font-family: var(--font-body);
      font-size: 0.85rem;
      font-weight: 500;
      padding: 10px 22px;
      border: 1px solid rgba(176, 124, 255, 0.4);
      border-radius: 100px;
      background: rgba(176, 124, 255, 0.08);
      color: #d4b8ff;
      cursor: pointer;
      transition: all 0.3s;
      letter-spacing: 0.03em;
    }

    .btn-create:hover {
      background: rgba(176, 124, 255, 0.18);
      border-color: rgba(176, 124, 255, 0.7);
      box-shadow: 0 0 24px rgba(176, 124, 255, 0.15);
      transform: translateY(-1px);
    }

    /* ========== HERO SECTION ========== */
    .hero {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: calc(var(--nav-h) + 20px) 24px 60px;
      text-align: center;
      overflow: hidden;
    }

    .hero-mouse-glow {
      position: absolute;
      width: 700px;
      height: 700px;
      border-radius: 50%;
      pointer-events: none;
      background: radial-gradient(circle, var(--glow-color, rgba(100, 80, 255, 0.06)), transparent 70%);
      transform: translate(-50%, -50%);
      left: var(--mx, 50%);
      top: var(--my, 50%);
      transition: left 0.6s ease-out, top 0.6s ease-out, background 0.8s;
      z-index: 0;
    }

    /* Orbit rings */
    .orbits {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .orbit-ring {
      position: absolute;
      border: 1px solid rgba(255, 255, 255, 0.03);
      border-radius: 50%;
      top: 50%;
      left: 50%;
    }

    .orbit-ring:nth-child(1) {
      width: 320px; height: 320px;
      margin: -160px 0 0 -160px;
      animation: orbit-spin 50s linear infinite;
    }
    .orbit-ring:nth-child(2) {
      width: 500px; height: 500px;
      margin: -250px 0 0 -250px;
      animation: orbit-spin 80s linear infinite reverse;
    }
    .orbit-ring:nth-child(3) {
      width: 700px; height: 700px;
      margin: -350px 0 0 -350px;
      animation: orbit-spin 120s linear infinite;
    }

    .orbit-dot {
      position: absolute;
      width: 5px; height: 5px;
      border-radius: 50%;
      background: var(--holiday);
      box-shadow: 0 0 8px var(--holiday);
      top: -2.5px;
      left: 50%;
      margin-left: -2.5px;
    }

    .orbit-ring:nth-child(2) .orbit-dot { background: var(--tech); box-shadow: 0 0 8px var(--tech); }
    .orbit-ring:nth-child(3) .orbit-dot { background: var(--sports); box-shadow: 0 0 8px var(--sports); opacity: 0.5; }

    @keyframes orbit-spin { to { transform: rotate(360deg); } }

    .hero-content {
      position: relative;
      z-index: 2;
    }

    .hero-emoji-wrap {
      position: relative;
      display: inline-block;
      margin-bottom: 20px;
      animation: hero-enter 1s ease-out 0.2s both;
    }

    .hero-emoji {
      font-size: clamp(3.5rem, 8vw, 5.5rem);
      filter: drop-shadow(0 0 20px rgba(255,255,255,0.15));
    }

    .hero-emoji-glow {
      position: absolute;
      inset: -40px;
      border-radius: 50%;
      filter: blur(45px);
      opacity: 0.35;
      animation: pulse-glow 4s ease-in-out infinite;
      z-index: -1;
    }

    @keyframes pulse-glow {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 0.45; transform: scale(1.15); }
    }

    .hero-tag {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      padding: 5px 14px;
      border-radius: 100px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      margin-bottom: 16px;
      animation: hero-enter 1s ease-out 0.35s both;
    }

    .hero-title {
      font-family: var(--font-body);
      font-weight: 900;
      font-size: clamp(2rem, 5.5vw, 3.8rem);
      line-height: 1.15;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
      animation: hero-enter 1s ease-out 0.45s both;
    }

    .hero-subtitle {
      font-size: clamp(0.9rem, 2vw, 1.15rem);
      color: var(--text-secondary);
      font-weight: 300;
      margin-bottom: 48px;
      animation: hero-enter 1s ease-out 0.55s both;
    }

    @keyframes hero-enter {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Hero Countdown */
    .hero-countdown {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: clamp(12px, 3vw, 32px);
      margin-bottom: 40px;
      animation: hero-enter 1s ease-out 0.65s both;
    }

    .countdown-unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .digit-group {
      display: flex;
      gap: 6px;
    }

    .digit-box {
      display: flex;
      align-items: center;
      justify-content: center;
      width: clamp(46px, 8vw, 82px);
      height: clamp(58px, 10vw, 104px);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: clamp(8px, 1.5vw, 14px);
      font-family: var(--font-mono);
      font-weight: 900;
      font-size: clamp(1.6rem, 4.5vw, 3.4rem);
      color: var(--text-primary);
      position: relative;
      overflow: hidden;
      transition: border-color 0.3s;
    }

    .digit-box::after {
      content: '';
      position: absolute;
      left: 0; right: 0;
      top: 50%;
      height: 1px;
      background: rgba(255, 255, 255, 0.04);
    }

    .digit-box.tick {
      animation: digit-tick 0.35s ease-out;
    }

    @keyframes digit-tick {
      0% { transform: scale(1.12); color: #fff; border-color: rgba(255,255,255,0.2); }
      100% { transform: scale(1); }
    }

    .unit-label {
      font-size: clamp(0.65rem, 1.2vw, 0.8rem);
      color: var(--text-muted);
      letter-spacing: 0.15em;
      font-weight: 500;
      text-transform: uppercase;
    }

    .countdown-colon {
      font-family: var(--font-mono);
      font-size: clamp(1.2rem, 3vw, 2.2rem);
      color: var(--text-muted);
      margin-top: clamp(14px, 2.5vw, 28px);
      animation: colon-blink 1s step-end infinite;
    }

    @keyframes colon-blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.2; }
    }

    /* Hero Actions */
    .hero-actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
      animation: hero-enter 1s ease-out 0.8s both;
    }

    .hero-stat {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      color: var(--text-secondary);
      padding: 8px 16px;
      border-radius: 100px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--glass-border);
    }

    .hero-stat .fire-count { color: #ff9500; font-weight: 700; }
    .hero-stat .follow-count { font-weight: 600; color: var(--text-primary); }

    .btn-action {
      font-family: var(--font-body);
      font-size: 0.85rem;
      font-weight: 600;
      padding: 10px 24px;
      border-radius: 100px;
      border: none;
      cursor: pointer;
      transition: all 0.3s;
      letter-spacing: 0.02em;
    }

    .btn-track {
      background: rgba(255,255,255,0.1);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.15);
    }
    .btn-track:hover { background: rgba(255,255,255,0.18); transform: translateY(-1px); }
    .btn-track.active {
      background: rgba(176, 124, 255, 0.2);
      border-color: rgba(176, 124, 255, 0.5);
      color: #d9c0ff;
    }

    .btn-share {
      background: transparent;
      color: var(--text-secondary);
      border: 1px solid var(--glass-border);
      position: relative;
    }
    .btn-share:hover { color: #fff; border-color: rgba(255,255,255,0.25); }

    .share-toast {
      position: absolute;
      top: -36px;
      left: 50%;
      transform: translateX(-50%) translateY(8px);
      font-size: 0.75rem;
      padding: 4px 12px;
      border-radius: 6px;
      background: rgba(0,200,100,0.2);
      color: #6fda9c;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s;
    }
    .share-toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ========== FILTERS ========== */
    .filters-section {
      position: relative;
      z-index: 1;
      padding: 0 clamp(20px, 4vw, 48px);
      margin-bottom: 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }

    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-btn {
      font-family: var(--font-body);
      font-size: 0.8rem;
      font-weight: 500;
      padding: 8px 18px;
      border-radius: 100px;
      border: 1px solid var(--glass-border);
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.3s;
    }

    .filter-btn:hover {
      color: var(--text-primary);
      border-color: rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.04);
    }

    .filter-btn.active {
      color: #fff;
      background: rgba(255,255,255,0.08);
      border-color: rgba(255,255,255,0.2);
    }

    .section-title {
      font-family: var(--font-display);
      font-size: clamp(0.7rem, 1.5vw, 0.85rem);
      font-weight: 700;
      letter-spacing: 0.2em;
      color: var(--text-muted);
    }

    /* ========== EVENTS GRID ========== */
    .events-section {
      position: relative;
      z-index: 1;
      padding: 0 clamp(20px, 4vw, 48px) 80px;
    }

    .events-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 20px;
    }

    /* ========== EVENT CARD ========== */
    .event-card {
      position: relative;
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 28px;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
      opacity: 0;
      transform: translateY(40px);
    }

    .event-card .card-click-hint {
      position: absolute;
      top: 14px;
      right: 14px;
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      padding: 3px 10px;
      border-radius: 100px;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }

    .event-card:hover .card-click-hint {
      opacity: 1;
    }

    /* Hero swap animation */
    .hero-content.swap-out {
      animation: hero-swap-out 0.35s ease-in forwards;
    }
    .hero-content.swap-in {
      animation: hero-swap-in 0.5s ease-out forwards;
    }

    @keyframes hero-swap-out {
      to { opacity: 0; transform: translateY(-30px) scale(0.97); }
    }
    @keyframes hero-swap-in {
      from { opacity: 0; transform: translateY(30px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .event-card.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .event-card:hover {
      border-color: color-mix(in srgb, var(--card-color) 30%, transparent);
      transform: translateY(-4px);
    }

    /* Card glow on hover */
    .event-card::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 20px;
      background: radial-gradient(ellipse at 50% 0%, var(--card-color), transparent 70%);
      opacity: 0;
      transition: opacity 0.4s;
      z-index: -1;
      filter: blur(40px);
    }

    .event-card:hover::before {
      opacity: 0.15;
    }

    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .card-emoji-wrap {
      position: relative;
    }

    .card-emoji {
      font-size: 2.6rem;
      line-height: 1;
    }

    .card-emoji-glow {
      position: absolute;
      inset: -15px;
      border-radius: 50%;
      filter: blur(20px);
      opacity: 0.25;
      z-index: -1;
    }

    .card-category {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid;
      opacity: 0.7;
    }

    .card-category[data-cat="sports"] { color: var(--sports); border-color: rgba(0,255,135,0.25); background: rgba(0,255,135,0.06); }
    .card-category[data-cat="tech"] { color: var(--tech); border-color: rgba(0,153,255,0.25); background: rgba(0,153,255,0.06); }
    .card-category[data-cat="entertainment"] { color: var(--entertainment); border-color: rgba(255,51,102,0.25); background: rgba(255,51,102,0.06); }
    .card-category[data-cat="holiday"] { color: var(--holiday); border-color: rgba(176,124,255,0.25); background: rgba(176,124,255,0.06); }

    .card-name {
      font-weight: 800;
      font-size: 1.2rem;
      line-height: 1.3;
      margin-bottom: 4px;
    }

    .card-subtitle {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 300;
      margin-bottom: 22px;
    }

    .card-date {
      font-size: 0.72rem;
      color: var(--text-secondary);
      font-weight: 400;
      margin-bottom: 18px;
      letter-spacing: 0.03em;
    }

    /* Card countdown */
    .card-countdown {
      display: flex;
      gap: 8px;
      margin-bottom: 22px;
    }

    .card-cd-unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      flex: 1;
    }

    .card-cd-digits {
      display: flex;
      gap: 3px;
      width: 100%;
    }

    .card-digit {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 44px;
      background: rgba(255,255,255,0.035);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 8px;
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 1.05rem;
    }

    .card-digit.tick {
      animation: digit-tick 0.35s ease-out;
    }

    .card-cd-label {
      font-size: 0.6rem;
      color: var(--text-muted);
      letter-spacing: 0.12em;
      font-weight: 500;
    }

    /* Card hype bar */
    .card-hype {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }

    .hype-bar-track {
      flex: 1;
      height: 4px;
      background: rgba(255,255,255,0.06);
      border-radius: 4px;
      overflow: hidden;
    }

    .hype-bar-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.6s ease-out;
    }

    .hype-label {
      font-size: 0.72rem;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .hype-value {
      font-weight: 700;
      font-family: var(--font-mono);
      font-size: 0.7rem;
    }

    /* Card footer */
    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 16px;
      border-top: 1px solid rgba(255,255,255,0.05);
    }

    .card-followers {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .card-followers strong {
      color: var(--text-secondary);
      font-weight: 600;
    }

    .card-actions {
      display: flex;
      gap: 6px;
    }

    .card-btn {
      font-family: var(--font-body);
      font-size: 0.72rem;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid var(--glass-border);
      background: transparent;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.25s;
    }

    .card-btn:hover {
      color: #fff;
      background: rgba(255,255,255,0.06);
      border-color: rgba(255,255,255,0.15);
    }

    .card-btn-fire {
      border-color: rgba(255, 149, 0, 0.25);
      color: #ff9500;
    }
    .card-btn-fire:hover {
      background: rgba(255, 149, 0, 0.1);
      border-color: rgba(255, 149, 0, 0.5);
      color: #ffaa33;
    }
    .card-btn-fire.voted {

    /* ========== CREATE MODAL ========== */

    .event-card:nth-child(5) { transition-delay: 0.25s; }
    .event-card:nth-child(6) { transition-delay: 0.3s; }
    .event-card:nth-child(7) { transition-delay: 0.35s; }
    .event-card:nth-child(8) { transition-delay: 0.4s; }
    .event-card:nth-child(9) { transition-delay: 0.45s; }

    /* ========== SCROLLBAR ========== */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

    /* ========== GLOBAL STATS BAR ========== */
    .nav-stats {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .global-counter {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      color: var(--text-secondary);
      padding: 6px 14px;
      border-radius: 100px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--glass-border);
    }

    .global-counter .counter-num {
      font-family: var(--font-mono);
      font-weight: 700;
      color: #ff9500;
      font-size: 0.8rem;
    }

    .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #00ff87;
      animation: live-blink 2s ease-in-out infinite;
    }

    @keyframes live-blink {
      0%, 100% { opacity: 1; box-shadow: 0 0 4px #00ff87; }
      50% { opacity: 0.4; box-shadow: none; }
    }

    .btn-fire-hero {
      background: rgba(255, 149, 0, 0.1);
      color: #ff9500;
      border: 1px solid rgba(255, 149, 0, 0.3);
    }
    .btn-fire-hero:hover {
      background: rgba(255, 149, 0, 0.2);
      border-color: rgba(255, 149, 0, 0.5);
      transform: translateY(-1px);
    }
    .btn-fire-hero.voted {
      background: rgba(255, 149, 0, 0.15);
      border-color: rgba(255, 149, 0, 0.45);
      color: #ffaa33;
    }

    .vote-burst {
      position: fixed;
      pointer-events: none;
      font-size: 1.5rem;
      z-index: 300;
      animation: burst-up 0.8s ease-out forwards;
    }

    @keyframes burst-up {
      0% { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-60px) scale(1.5); }
    }

    @media (max-width: 768px) {
      .global-counter { display: none; }
    }
  </style>
</head>
<body>
  <!-- Background layers -->
  <canvas id="starfield"></canvas>

  <!-- Create Modal -->
  <div class="modal-overlay" id="createModal">
    <div class="modal">
      <h2>建立新的倒數</h2>
      <p class="modal-desc">新增一個全世界都能追蹤的倒數計時</p>

      <div class="modal-btns">
        <button class="btn-modal-cancel" id="btnCancel">取消</button>
        <button class="btn-modal-submit" id="btnSubmit">建立倒數 🚀</button>
      </div>

  </div>

  <!-- Firebase SDK (全球即時同步 — 選用) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

  <script>
    /* ========== FIREBASE CONFIG ========== */
    // 到 https://console.firebase.google.com 建立 Realtime Database 專案
    // 填入以下設定後即可啟用全球即時投票同步
    // 未設定時使用 localStorage（每位使用者獨立資料）
    const FIREBASE_CONFIG = {
      apiKey: "",
      authDomain: "",
      databaseURL: "",
      projectId: "",
    };

    let db = null;
    let useFirebase = false;

    if (FIREBASE_CONFIG.apiKey && typeof firebase !== 'undefined') {
      try {
        firebase.initializeApp(FIREBASE_CONFIG);
        db = firebase.database();
        useFirebase = true;
        console.log('🔥 Firebase connected — real-time sync enabled');
      } catch(e) {
        console.warn('Firebase init failed, using localStorage');
      }
    }

    /* ========== LOCAL STORAGE ========== */
    function loadJSON(key, fallback) {
      try { return JSON.parse(localStorage.getItem(key)) || fallback; } catch { return fallback; }
    }

    let voteCounts = loadJSON('dp_votes', {});
    let myVotes = loadJSON('dp_my_votes', {});

    function saveVoteCounts(data) { localStorage.setItem('dp_votes', JSON.stringify(data)); }
    function saveMyVotes(data) { localStorage.setItem('dp_my_votes', JSON.stringify(data)); }
    function loadUserEvents() { return loadJSON('dp_user_events', []); }
    function saveUserEvents(list) { localStorage.setItem('dp_user_events', JSON.stringify(list)); }

    // 首次造訪：生成初始投票種子（小數字，真實感）
    if (!localStorage.getItem('dp_seeded')) {
      const seeds = {};
      [1,2,3,4,5,6,7,8,9].forEach(id => { seeds[id] = Math.floor(Math.random() * 18) + 5; });
      voteCounts = seeds;
      saveVoteCounts(seeds);
      localStorage.setItem('dp_seeded', '1');
    }

    /* ========== EVENT DATA ========== */
    const CATEGORY_MAP = {
      sports: { label: '體育', color: '#00FF87', emoji: '⚡' },
      tech: { label: '科技', color: '#0099FF', emoji: '💡' },

    const events = [
      {
        id: 1,

        subtitle: '美國・墨西哥・加拿大 — 史上首屆 48 隊制',

      {

        date: '2026-09-09T10:00:00',
        category: 'tech',
        emoji: '🍎',
        color: '#0099FF',
        hype: 88,
        followers: 18200,
      },
      {
        id: 3,
        name: 'Avengers: Secret Wars',
        subtitle: 'Marvel Studios · 多元宇宙傳奇終章',
        date: '2027-05-07T00:00:00',
        category: 'entertainment',
        emoji: '🦸',
        color: '#FF3366',
        hype: 91,
        followers: 31500,
      },
      {
        id: 4,
        name: '2028 洛杉磯奧運',
        subtitle: 'LA 2028 Summer Olympics',
        date: '2028-07-14T00:00:00',
        category: 'sports',
        emoji: '🏅',
        color: '#FFD700',
        hype: 82,
        followers: 12800,
      },
      {
        id: 5,
        name: '2027 跨年倒數',
        subtitle: '再見 2026，你好 2027 🎊',
        date: '2027-01-01T00:00:00',
        category: 'holiday',
        emoji: '🎆',
        color: '#B07CFF',
        hype: 76,
        followers: 8900,
      },
      {
        id: 6,
        name: '聖誕節 2026',
        subtitle: 'Merry Christmas 🎁',
        date: '2026-12-25T00:00:00',
        category: 'holiday',
        emoji: '🎄',
        color: '#FF5555',
        hype: 71,
        followers: 6700,
      },
      {
        id: 7,
        name: 'NASA Artemis III',
        subtitle: '人類睽違半世紀重返月球',
        date: '2026-11-01T00:00:00',
        category: 'tech',
        emoji: '🚀',
        color: '#00D4FF',
        hype: 87,
        followers: 15600,
      },
      {
        id: 8,
        name: '端午節 2026',
        subtitle: '龍舟競渡・吃粽子・紀念屈原',
        date: '2026-06-19T00:00:00',
        category: 'holiday',
        emoji: '🐲',
        color: '#44CC88',
        hype: 65,
        followers: 4200,
      },
      {
        id: 9,
        name: 'GTA VI',
        subtitle: 'Rockstar Games · Vice City 回歸',
        date: '2026-10-27T00:00:00',
        category: 'entertainment',
        emoji: '🎮',
        color: '#FF8800',
        hype: 96,
        followers: 42100,
      },
    ];

    /* ========== VOTE HELPERS ========== */
    function getVoteCount(id) { return voteCounts[id] || 0; }
    function hasVoted(id) { return !!myVotes[id]; }

    function getVoteBarWidth(id) {
      const maxVotes = Math.max(1, ...events.map(e => getVoteCount(e.id)));
      return Math.round((getVoteCount(id) / maxVotes) * 100);
    }

    function updateGlobalCounter() {
      const total = Object.values(voteCounts).reduce((a, b) => a + b, 0);
      const el = document.getElementById('globalVoteCount');
      if (el) el.textContent = total.toLocaleString();
    }

    function updateAllVoteDisplays() {
      const heroFireCount = document.querySelector('.hero-stat .fire-count');
      if (heroFireCount) heroFireCount.textContent = getVoteCount(heroEvent.id);
      const heroFireBtn = document.querySelector('.btn-fire-hero');
      if (heroFireBtn && hasVoted(heroEvent.id)) {
        heroFireBtn.classList.add('voted');
        heroFireBtn.textContent = '🔥 已投票';
      }
      events.forEach(ev => {
        const card = document.querySelector(`.event-card[data-id="${ev.id}"]`);
        if (!card) return;
        const fill = card.querySelector('.hype-bar-fill');
        const val = card.querySelector('.hype-value');
        const countEl = card.querySelector('.card-followers strong');
        if (fill) fill.style.width = getVoteBarWidth(ev.id) + '%';
        if (val) val.textContent = getVoteCount(ev.id) + ' 票';
        if (countEl) countEl.textContent = getVoteCount(ev.id);
      });
      updateGlobalCounter();
    }

    // Firebase 即時監聽
    if (useFirebase && db) {
      db.ref('votes').on('value', (snapshot) => {
        voteCounts = snapshot.val() || {};
        updateAllVoteDisplays();
      });
    }

    /* ========== UTILITY ========== */
    function getCountdown(dateStr) {
      const diff = new Date(dateStr).getTime() - Date.now();
      if (diff <= 0) return { days: 0, hours: 0, minutes: 0, seconds: 0, expired: true, total: 0 };
      return {
        days: Math.floor(diff / 86400000),
        hours: Math.floor((diff / 3600000) % 24),
        minutes: Math.floor((diff / 60000) % 60),
        seconds: Math.floor((diff / 1000) % 60),
        expired: false,
        total: diff,
      };
    }

    function pad(n) { return String(n).padStart(2, '0'); }
    function padDays(n) { return String(n).padStart(3, '0'); }

    function formatFollowers(n) {
      if (n >= 10000) return (n / 10000).toFixed(1) + '萬';
      if (n >= 1000) return (n / 1000).toFixed(1) + 'K';
      return String(n);
    }

    function formatDate(dateStr) {
      const d = new Date(dateStr);
      return `${d.getFullYear()} 年 ${d.getMonth() + 1} 月 ${d.getDate()} 日`;
    }

    /* ========== HERO ========== */
    function getHeroEvent() {
      const now = Date.now();
      const upcoming = events.filter(e => new Date(e.date).getTime() > now);
      if (upcoming.length === 0) return events[0];
      upcoming.sort((a, b) => new Date(a.date) - new Date(b.date));
      return upcoming[0];
    }

    let heroEvent = getHeroEvent();

    function buildHeroCountdown() {
      const cd = getCountdown(heroEvent.date);
      const days = padDays(cd.days);
      const hrs = pad(cd.hours);
      const mins = pad(cd.minutes);
      const secs = pad(cd.seconds);

      return `
        <div class="countdown-unit">
          <div class="digit-group">
            ${days.split('').map(d => `<div class="digit-box hero-digit">${d}</div>`).join('')}
          </div>
          <span class="unit-label">天</span>
        </div>
        <span class="countdown-colon">:</span>
        <div class="countdown-unit">
          <div class="digit-group">
            ${hrs.split('').map(d => `<div class="digit-box hero-digit">${d}</div>`).join('')}
          </div>
          <span class="unit-label">時</span>
        </div>
        <span class="countdown-colon">:</span>
        <div class="countdown-unit">
          <div class="digit-group">
            ${mins.split('').map(d => `<div class="digit-box hero-digit">${d}</div>`).join('')}
          </div>
          <span class="unit-label">分</span>
        </div>
        <span class="countdown-colon">:</span>
        <div class="countdown-unit">
          <div class="digit-group">
            ${secs.split('').map(d => `<div class="digit-box hero-digit">${d}</div>`).join('')}
          </div>
          <span class="unit-label">秒</span>
        </div>
      `;
    }

    function renderHero() {
      const e = heroEvent;
      document.getElementById('heroEmoji').textContent = e.emoji;
      document.getElementById('heroGlow').style.background = e.color;
      document.getElementById('heroTag').textContent = `${CATEGORY_MAP[e.category].emoji} ${CATEGORY_MAP[e.category].label}`;
      document.getElementById('heroTag').style.color = e.color;
      document.getElementById('heroTitle').textContent = e.name;
      document.getElementById('heroSubtitle').textContent = e.subtitle;
      document.getElementById('heroCountdown').innerHTML = buildHeroCountdown();
      document.querySelector('.hero-mouse-glow').style.setProperty('--glow-color', e.color.replace(')', ', 0.07)').replace('rgb', 'rgba').replace('#', ''));
      // Simpler: set CSS variable
      document.querySelector('.hero-mouse-glow').style.background =
        `radial-gradient(circle, ${e.color}11, transparent 70%)`;

      const votes = getVoteCount(e.id);
      const voted = hasVoted(e.id);
      document.getElementById('heroActions').innerHTML = `
        <div class="hero-stat">🔥 <span class="fire-count">${votes}</span> 票</div>
        <button class="btn-action btn-fire-hero ${voted ? 'voted' : ''}" onclick="voteHype(this, ${e.id})">${voted ? '🔥 已投票' : '🔥 投一票'}</button>
        <button class="btn-action btn-share" onclick="shareEvent(${e.id})">
          分享
          <span class="share-toast" id="toast-hero">已複製！</span>
        </button>
      `;
    }

    function updateHeroDigits() {
      const cd = getCountdown(heroEvent.date);
      const days = padDays(cd.days);
      const hrs = pad(cd.hours);
      const mins = pad(cd.minutes);
      const secs = pad(cd.seconds);
      const allDigits = days + hrs + mins + secs;

      const digitEls = document.querySelectorAll('.hero-digit');
      allDigits.split('').forEach((d, i) => {
        if (digitEls[i] && digitEls[i].textContent !== d) {
          digitEls[i].textContent = d;
          digitEls[i].classList.add('tick');
          setTimeout(() => digitEls[i].classList.remove('tick'), 350);
        }
      });
    }

    /* ========== CARDS ========== */
    function buildCardCountdown(event) {
      const cd = getCountdown(event.date);
      const units = [
        { val: pad(cd.days > 99 ? cd.days : cd.days), label: '天', digits: String(cd.days).padStart(cd.days > 99 ? 3 : 2, '0') },
        { val: pad(cd.hours), label: '時', digits: pad(cd.hours) },
        { val: pad(cd.minutes), label: '分', digits: pad(cd.minutes) },
        { val: pad(cd.seconds), label: '秒', digits: pad(cd.seconds) },
      ];

      return units.map(u => `
        <div class="card-cd-unit">
          <div class="card-cd-digits">
            ${u.digits.split('').map(d => `<div class="card-digit" data-event="${event.id}">${d}</div>`).join('')}
          </div>
          <span class="card-cd-label">${u.label}</span>
        </div>
      `).join('');
    }

    function renderCard(event) {
      const cd = getCountdown(event.date);
      const expiredClass = cd.expired ? ' expired' : '';

      return `
        <div class="event-card${expiredClass}" data-category="${event.category}" data-id="${event.id}" style="--card-color: ${event.color}" onclick="switchHero(${event.id})">
          <span class="card-click-hint">點擊切換主畫面 ↑</span>
          <div class="card-header">
            <div class="card-emoji-wrap">
              <div class="card-emoji">${event.emoji}</div>
              <div class="card-emoji-glow" style="background: ${event.color}"></div>
            </div>
            <span class="card-category" data-cat="${event.category}">${CATEGORY_MAP[event.category].label}</span>
          </div>
          <div class="card-name">${event.name}</div>
          <div class="card-subtitle">${event.subtitle}</div>
          <div class="card-date">📅 ${formatDate(event.date)}</div>
          <div class="card-countdown" id="card-cd-${event.id}">
            ${buildCardCountdown(event)}
          </div>
          <div class="card-hype">
            <span class="hype-label">🔥 投票</span>
            <div class="hype-bar-track">
              <div class="hype-bar-fill" style="width: ${getVoteBarWidth(event.id)}%; background: linear-gradient(90deg, ${event.color}88, ${event.color})"></div>
            </div>
            <span class="hype-value" style="color: ${event.color}">${getVoteCount(event.id)} 票</span>
          </div>
          <div class="card-footer">
            <div class="card-followers">🔥 <strong>${getVoteCount(event.id)}</strong> 人投票</div>
            <div class="card-actions">
              <button class="card-btn card-btn-fire ${hasVoted(event.id) ? 'voted' : ''}" onclick="event.stopPropagation(); voteHype(this, ${event.id})">${hasVoted(event.id) ? '🔥 已投' : '🔥 +1'}</button>
              <button class="card-btn" onclick="event.stopPropagation(); shareEvent(${event.id})">分享</button>
            </div>
          </div>
        </div>
      `;
    }

    function renderGrid(filter = 'all') {
      const grid = document.getElementById('eventsGrid');
      const sorted = [...events]
        .filter(e => filter === 'all' || e.category === filter)
        .filter(e => e.id !== heroEvent.id)
        .sort((a, b) => new Date(a.date) - new Date(b.date));

      grid.innerHTML = sorted.map(renderCard).join('');

      // Trigger staggered reveal
      requestAnimationFrame(() => {
        const cards = grid.querySelectorAll('.event-card');
        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.add('visible');
              observer.unobserve(entry.target);
            }
          });
        }, { threshold: 0.08 });
        cards.forEach(card => observer.observe(card));
      });
    }

    function updateCardDigits() {
      events.forEach(event => {
        if (event.id === heroEvent.id) return;
        const cd = getCountdown(event.date);
        const daysStr = String(cd.days).padStart(cd.days > 99 ? 3 : 2, '0');
        const allDigits = daysStr + pad(cd.hours) + pad(cd.minutes) + pad(cd.seconds);
        const digitEls = document.querySelectorAll(`.card-digit[data-event="${event.id}"]`);
        allDigits.split('').forEach((d, i) => {
          if (digitEls[i] && digitEls[i].textContent !== d) {
            digitEls[i].textContent = d;
            digitEls[i].classList.add('tick');
            setTimeout(() => digitEls[i].classList.remove('tick'), 350);
          }
        });
      });
    }

    /* ========== SWITCH HERO ========== */
    function switchHero(id) {
      const event = events.find(e => e.id === id);
      if (!event || event.id === heroEvent.id) return;

      const heroContent = document.querySelector('.hero-content');
      heroContent.classList.add('swap-out');

      // Scroll to top smoothly
      window.scrollTo({ top: 0, behavior: 'smooth' });

      setTimeout(() => {
        heroEvent = event;
        renderHero();
        heroContent.classList.remove('swap-out');
        heroContent.classList.add('swap-in');

        // Re-render grid (exclude new hero)
        const activeFilter = document.querySelector('.filter-btn.active').dataset.filter;
        renderGrid(activeFilter);

        setTimeout(() => heroContent.classList.remove('swap-in'), 500);
      }, 350);
    }

    /* ========== INTERACTIONS ========== */
    function shareEvent(id) {
      const event = events.find(e => e.id === id);
      if (!event) return;
      const cd = getCountdown(event.date);
      const votes = getVoteCount(id);
      const text = `距離 ${event.name} 還有 ${cd.days} 天！${event.emoji}\n🔥 ${votes} 人已投票\n\n🚀 來 T-Minus 一起倒數\nhttps://roywg925.github.io/deadline-planet/\n#TMinus`;

      if (navigator.share) {
        navigator.share({ title: `距離 ${event.name} 還有 ${cd.days} 天`, text, url: 'https://roywg925.github.io/deadline-planet/' }).catch(() => {});
      } else if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => {
          showCopyToast();
        });
      }
    }

    function showCopyToast() {
      // Create a floating toast
      const toast = document.createElement('div');
      toast.textContent = '✅ 已複製到剪貼簿';
      Object.assign(toast.style, {
        position: 'fixed',
        bottom: '32px',
        left: '50%',
        transform: 'translateX(-50%) translateY(10px)',
        padding: '10px 24px',
        borderRadius: '12px',
        background: 'rgba(0, 200, 100, 0.15)',
        border: '1px solid rgba(0, 200, 100, 0.3)',
        color: '#6fda9c',
        fontSize: '0.85rem',
        fontFamily: 'var(--font-body)',
        backdropFilter: 'blur(12px)',
        zIndex: '300',
        opacity: '0',
        transition: 'all 0.3s',
      });
      document.body.appendChild(toast);
      requestAnimationFrame(() => {
        toast.style.opacity = '1';
        toast.style.transform = 'translateX(-50%) translateY(0)';
      });
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(-50%) translateY(10px)';
        setTimeout(() => toast.remove(), 300);
      }, 2000);
    }

    function voteHype(btn, id) {
      if (window.event) window.event.stopPropagation();
      if (hasVoted(id) || btn.classList.contains('voted')) return;

      // 儲存投票
      myVotes[id] = true;
      saveMyVotes(myVotes);
      voteCounts[id] = (voteCounts[id] || 0) + 1;
      saveVoteCounts(voteCounts);

      // Firebase 同步
      if (useFirebase && db) {
        db.ref('votes/' + id).transaction(current => (current || 0) + 1);
      }

      // 視覺回饋
      btn.classList.add('voted');
      btn.textContent = '🔥 已投';

      // 🔥 爆裂動畫
      const rect = btn.getBoundingClientRect();
      const burst = document.createElement('div');
      burst.className = 'vote-burst';
      burst.textContent = '🔥';
      burst.style.left = (rect.left + rect.width / 2) + 'px';
      burst.style.top = rect.top + 'px';
      document.body.appendChild(burst);
      setTimeout(() => burst.remove(), 800);

      // 更新所有顯示
      updateAllVoteDisplays();
    }

    /* ========== FILTERS ========== */
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderGrid(btn.dataset.filter);
      });
    });

    /* ========== MODAL ========== */
    const modal = document.getElementById('createModal');
    document.getElementById('btnCreate').addEventListener('click', () => modal.classList.add('open'));
    document.getElementById('btnCancel').addEventListener('click', () => modal.classList.remove('open'));
    modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.remove('open'); });

    document.getElementById('btnSubmit').addEventListener('click', () => {
      const name = document.getElementById('inputName').value.trim();
      const date = document.getElementById('inputDate').value;
      const category = document.getElementById('inputCategory').value;
      const subtitle = document.getElementById('inputSubtitle').value.trim();

      if (!name || !date) return;

      const cat = CATEGORY_MAP[category];
      const newEvent = {
        id: Date.now(),
        name,
        subtitle: subtitle || name,
        date: new Date(date).toISOString(),
        category,
        emoji: cat.emoji,
        color: cat.color,
        hype: 0,
        followers: 0,
      };

      events.push(newEvent);

      // 儲存到 localStorage
      const userEvts = loadUserEvents();
      userEvts.push(newEvent);
      saveUserEvents(userEvts);

      modal.classList.remove('open');

      // Reset form
      document.getElementById('inputName').value = '';
      document.getElementById('inputDate').value = '';
      document.getElementById('inputSubtitle').value = '';

      // Re-render
      const activeFilter = document.querySelector('.filter-btn.active').dataset.filter;
      renderGrid(activeFilter);
    });

    /* ========== HERO MOUSE GLOW ========== */
    const heroSection = document.getElementById('hero');
    const mouseGlow = document.querySelector('.hero-mouse-glow');

    heroSection.addEventListener('mousemove', (e) => {
      const rect = heroSection.getBoundingClientRect();
      mouseGlow.style.setProperty('--mx', (e.clientX - rect.left) + 'px');
      mouseGlow.style.setProperty('--my', (e.clientY - rect.top) + 'px');
    });

    /* ========== STARFIELD CANVAS ========== */
    const canvas = document.getElementById('starfield');
    const ctx = canvas.getContext('2d');

    let stars = [];
    let shootingStars = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    function initStars() {
      stars = Array.from({ length: 180 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 1.4 + 0.3,
        baseAlpha: Math.random() * 0.6 + 0.2,
        phase: Math.random() * Math.PI * 2,
        speed: Math.random() * 0.3 + 0.1,
      }));
    }

    function drawStars(t) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Stars
      stars.forEach(s => {
        const alpha = s.baseAlpha + Math.sin(t * 0.001 * s.speed + s.phase) * 0.2;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(220, 225, 255, ${Math.max(0.05, Math.min(1, alpha))})`;
        ctx.fill();
      });

      // Shooting stars
      if (Math.random() < 0.002) {
        shootingStars.push({
          x: Math.random() * canvas.width * 0.8,
          y: Math.random() * canvas.height * 0.4,
          len: Math.random() * 100 + 60,
          speed: Math.random() * 8 + 5,
          life: 1,
        });
      }

      shootingStars.forEach((ss, i) => {
        ss.x += ss.speed;
        ss.y += ss.speed * 0.6;
        ss.life -= 0.02;

        if (ss.life > 0) {
          const grad = ctx.createLinearGradient(ss.x, ss.y, ss.x - ss.len * 0.7, ss.y - ss.len * 0.42);
          grad.addColorStop(0, `rgba(255, 255, 255, ${ss.life * 0.8})`);
          grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
          ctx.beginPath();
          ctx.moveTo(ss.x, ss.y);
          ctx.lineTo(ss.x - ss.len * 0.7, ss.y - ss.len * 0.42);
          ctx.strokeStyle = grad;
          ctx.lineWidth = 1.2;
          ctx.stroke();
        }
      });

      shootingStars = shootingStars.filter(ss => ss.life > 0);
    }

    function animate(t) {
      drawStars(t);
      requestAnimationFrame(animate);
    }

    window.addEventListener('resize', () => {
      resizeCanvas();
      initStars();
    });

    /* ========== INIT ========== */
    // 載入使用者自建事件
    loadUserEvents().forEach(e => events.push(e));

    resizeCanvas();
    initStars();
    renderHero();
    renderGrid();
    updateGlobalCounter();
    requestAnimationFrame(animate);

    // Tick every second
    setInterval(() => {
      updateHeroDigits();
      updateCardDigits();
    }, 1000);
  </script>
</body>
</html>
